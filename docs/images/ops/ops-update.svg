<svg viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="更新は、バックアップ、配布物の展開、作り直し、確認の順。失敗したら前の版に戻し、表が変わった版ならバックアップから復元する">
  <style>
    text { font-family: "Yu Gothic UI", "Yu Gothic", Meiryo, "Hiragino Kaku Gothic ProN", sans-serif; }
    .no { font-size: 20px; font-weight: 700; fill: #39407a; font-family: Consolas, "JetBrains Mono", monospace; }
    .name { font-size: 13px; font-weight: 700; fill: #16181f; }
    .cmd { font-size: 10.5px; fill: #454a5c; font-family: Consolas, "JetBrains Mono", monospace; }
    .sub { font-size: 11px; fill: #6f7488; }
    .warn { font-size: 12px; font-weight: 700; fill: #8a6a1c; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7488"/>
    </marker>
  </defs>
  <rect width="900" height="250" fill="#ffffff"/>

  <g>
    <rect x="12" y="20" width="196" height="100" rx="5" fill="#ffffff" stroke="#b0b5c6"/>
    <text x="28" y="48" class="no">1</text>
    <text x="50" y="47" class="name">バックアップ</text>
    <text x="28" y="76" class="cmd">./scripts/backup-db.sh</text>
    <text x="28" y="100" class="sub">失敗したときの戻り先</text>
  </g>
  <line x1="208" y1="70" x2="230" y2="70" stroke="#6f7488" stroke-width="1.5" marker-end="url(#ar)"/>
  <g>
    <rect x="234" y="20" width="196" height="100" rx="5" fill="#ffffff" stroke="#b0b5c6"/>
    <text x="250" y="48" class="no">2</text>
    <text x="272" y="47" class="name">配布物を展開</text>
    <text x="250" y="76" class="cmd">tar xzf chem-system-….tar.gz</text>
    <text x="250" y="100" class="sub">.env.prod は上書きされない</text>
  </g>
  <line x1="430" y1="70" x2="452" y2="70" stroke="#6f7488" stroke-width="1.5" marker-end="url(#ar)"/>
  <g>
    <rect x="456" y="20" width="210" height="100" rx="5" fill="#e2e4f2" stroke="#39407a"/>
    <text x="472" y="48" class="no">3</text>
    <text x="494" y="47" class="name">作り直す</text>
    <text x="472" y="76" class="cmd">docker compose … up -d --build</text>
    <text x="472" y="100" class="sub">表の変更は起動時に自動で当たる</text>
  </g>
  <line x1="666" y1="70" x2="688" y2="70" stroke="#6f7488" stroke-width="1.5" marker-end="url(#ar)"/>
  <g>
    <rect x="692" y="20" width="196" height="100" rx="5" fill="#ffffff" stroke="#b0b5c6"/>
    <text x="708" y="48" class="no">4</text>
    <text x="730" y="47" class="name">確かめる</text>
    <text x="708" y="76" class="cmd">docker compose … ps</text>
    <text x="708" y="100" class="sub">3つとも running・ログイン</text>
  </g>

  <!-- 戻すとき -->
  <rect x="12" y="150" width="876" height="84" rx="5" fill="#f7f0dc" stroke="#8a6a1c"/>
  <text x="28" y="176" class="warn">うまくいかなかったとき</text>
  <text x="28" y="200" class="sub" style="fill:#454a5c">表が変わらない版 … 前の版の配布物で 2〜3 をやり直す（データベースはそのまま）</text>
  <text x="28" y="222" class="sub" style="fill:#454a5c">表が変わった版 … 前の版の配布物で 2〜3 をやり直したあと、1 のバックアップから復元する（更新後に入れた記録は消える）</text>
</svg>
