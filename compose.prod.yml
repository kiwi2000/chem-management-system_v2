# 本番構成（VPS・社内サーバー想定）: Caddy(HTTPS) → app(Next.js＋帳票 PDF 用の Chromium) → db(PostgreSQL)
#
# 使い方（VPS上）:
#   cp .env.prod.example .env.prod   → 値を編集（DB_PASSWORD は必ず変更）
#   docker compose -f compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f compose.prod.yml --env-file .env.prod exec app npx tsx scripts/set-password.ts <メール> <パスワード> --create
#   （法規制データは別の手順で投入する。docs/法規制データの作り方.md）
#   配布物とオフライン用イメージは scripts/package-release.sh で作る
#
# セキュリティ設計:
# - db / app はポートを一切公開しない（外部から到達できるのは Caddy の 80/443 のみ）
# - VPN(Tailscale)運用ではVPSのファイアウォールで 80/443 も Tailscale IF に限定する

# 各コンテナの記録（docker logs）の大きさに上限を付ける。付けないと際限なく増えてディスクを埋める（2026-10-16）
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    restart: always
    environment:
      POSTGRES_USER: chem
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD を .env.prod に設定してください}
      POSTGRES_DB: chem
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chem -d chem"]
      interval: 5s
      timeout: 3s
      retries: 30
    # ports: なし（アプリコンテナからのみ到達可）

  app:
    logging: *logging
    # 名前を固定する。オフラインのサーバーでは docker load したこの名前のイメージをそのまま使う（--build 無しで up）
    image: chem-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://chem:${DB_PASSWORD}@db:5432/chem?schema=public
      # 接続元の制限（.env.prod で決める）。ここに書かないとアプリに届かない（--env-file は compose の中の ${} を埋めるだけ）
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      IP_FILTER_MODE: ${IP_FILTER_MODE:-monitor}
      # 画面の設定（システム設定 › セキュリティ › アクセス制御）で締め出されたときの戻り道。1 にして up -d で作り直す
      IP_RULES_OFF: ${IP_RULES_OFF:-}
    volumes:
      # 作った帳票の PDF（既定の置き場所 /app/data/documents）。入れ物を作り直しても残す
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    # ports: なし（Caddy経由のみ）

  caddy:
    image: caddy:2-alpine
    logging: *logging
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  app-data:
  caddy-data:
  caddy-config:
